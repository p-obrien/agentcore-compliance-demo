[project]
name = "agentcore-compliance-demo-agents"
version = "0.1.0"
description = "Authenticated AgentCore demo runtimes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bedrock-agentcore==1.22.0",
  "boto3==1.43.86",
  "PyJWT[crypto]==2.13.0",
  "strands-agents==1.54.0",
]

[dependency-groups]
test = [
  "hypothesis==6.122.3",
  "jsonschema==4.23.0",
  "pytest==8.3.4",
]

[tool.uv]
package = false
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
